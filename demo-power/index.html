<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power dashboard · DebugPilot demo site</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0f1720;color:#e6edf3}
header{padding:18px 28px;background:#16212d;border-bottom:1px solid #263544}
header b{font-size:19px} header span{color:#8ba0b4;margin-left:10px;font-size:14px}
main{max-width:820px;margin:0 auto;padding:26px;display:grid;gap:14px}
.card{background:#16212d;border:1px solid #263544;border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.card h2{width:100%;margin:0 0 4px;font-size:15px;color:#8ba0b4;font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid #2f4a63;border-radius:8px;background:#1d3448;color:#e6edf3;padding:8px 14px;font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#8ba0b4}
input{font:inherit;padding:8px 10px;border:1px solid #2f4a63;border-radius:8px;background:#0f1720;color:#e6edf3;width:140px}
.msg{min-height:22px;font-size:14px;color:#ff8a7a} .msg.ok{color:#6fe0bf}
</style></head>
<body>
<header><b>Hall 1 · Power</b><span>A demo data center dashboard checked by DebugPilot</span></header>
<main>
  <section class="card"><h2>Rack load</h2><button data-rack="A1">Rack A1</button><button data-rack="A2">Rack A2</button><button data-rack="B2">Rack B2</button></section>
  <section class="card"><h2>Alarms</h2><button data-level="warning">Warnings</button><button data-level="critical">Critical</button></section>
  <section class="card"><h2>Total IT load</h2><label>Show in<input id="unit" value="kW"></label><button id="convert">Convert</button></section>
  <div id="msg" class="msg"></div>
</main>
<script src="power.js"></script>
<script src="app.js"></script>
</body></html>
