<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Shop · DebugPilot demo site</title>
<style>
  :root{--ink:#20264a;--muted:#7a7e95;--rule:#e8e3da;--paper:#faf7f3;--card:#fff;--accent:#2f3a74;--peach:#f4a283;--bad:#d0574b;--bad-bg:#fcebe8;--ok:#2f8a63;--ok-bg:#e6f4ec}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
  header{padding:22px 28px;background:linear-gradient(90deg,#2f3a74,#7d6ea8 70%,#f0a98e);color:#fff}
  header b{font-size:20px} header span{opacity:.8;margin-left:10px;font-size:14px}
  main{max-width:960px;margin:0 auto;padding:28px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .p{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
  .p .sw{height:70px;border-radius:10px} .p small{color:var(--muted)}
  button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 12px;font-weight:600}
  button.line{background:#fff;color:var(--ink);border-color:var(--rule)}
  aside{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
  ul{list-style:none;margin:0;padding:0} li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px} li.empty{color:var(--muted)}
  label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  input{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:9px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .msg{font-size:13.5px;border-radius:9px;padding:0} .msg.bad{background:var(--bad-bg);color:var(--bad);padding:8px 10px} .msg.ok{background:var(--ok-bg);color:var(--ok);padding:8px 10px}
  #receipt div{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
  .banner{display:block;width:100%;height:120px;object-fit:cover}
  .recs{margin-top:16px;font-size:14px;color:var(--muted)} .recs b{color:var(--ink)}
  .tips{grid-column:1/-1;font-size:13px;color:var(--muted)}
  @media (max-width:760px){ main{grid-template-columns:1fr} .grid{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<header><b>Little Shop</b><span>A demo website watched by DebugPilot</span></header>
<img class="banner" src="banner.png" alt="Little Shop summer sale">
<main>
  <section>
    <div class="grid">
      <div class="p"><div class="sw" style="background:#e3e8fb"></div><b>Coffee mug</b><small>$12.00</small><button data-add="mug">Add</button></div>
      <div class="p"><div class="sw" style="background:#dff1e7"></div><b>T-shirt</b><small>$24.00</small><button data-add="tee">Add</button></div>
      <div class="p"><div class="sw" style="background:#fde8dc"></div><b>Cap</b><small>$18.00</small><button data-add="cap">Add</button></div>
    </div>
    <div class="recs" id="recs">Loading recommendations…</div>
  </section>
  <aside>
    <b>Cart</b>
    <ul id="cart"></ul>
    <label>Coupon code<input id="coupon" placeholder="SAVE10" autocomplete="off"></label>
    <div class="row"><button id="checkout">Check out</button><button id="clear" class="line">Empty cart</button></div>
    <label>ZIP code<input id="zip" placeholder="60622" autocomplete="off"></label>
    <div class="row"><button id="ship" class="line">Estimate shipping</button></div>
    <div id="msg" class="msg"></div>
    <div id="receipt"></div>
  </aside>
  <p class="tips">Ways to crash it: check out with an empty cart, use a coupon that doesn't exist (real ones: SAVE10, WELCOME20), or estimate shipping with the ZIP box empty.</p>
</main>
<script src="cart.js"></script>
<script src="app.js"></script>
<script src="/watch.js" data-key="dp_demo" defer></script>
</body>
</html>
