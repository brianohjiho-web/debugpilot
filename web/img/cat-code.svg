    <!-- tail -->
    <path d="M150 170 C 196 168, 204 118, 176 104 C 168 100, 160 106, 166 112 C 182 122, 176 152, 146 156" fill="#b9aef7"/>
    <!-- body -->
    <path d="M62 196 C 50 160, 62 122, 104 118 C 146 116, 162 158, 150 196 Z" fill="#b9aef7"/>
    <!-- belly patch -->
    <path d="M88 196 C 84 170, 92 150, 106 150 C 122 150, 128 172, 122 196" fill="#f4f0ff" stroke-width="2.4"/>
    <!-- head with ears -->
