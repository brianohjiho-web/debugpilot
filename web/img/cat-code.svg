<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210" role="img" aria-label="DebugPilot's cat at a laptop">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6"/>
    </filter>
  </defs>
  <circle cx="110" cy="112" r="96" fill="#262951"/>
  <circle cx="110" cy="112" r="96" fill="none" stroke="#383b6b" stroke-width="1.5"/>
