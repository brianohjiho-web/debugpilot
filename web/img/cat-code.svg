    <!-- inner ears -->
    <path d="M69 46 C 74 50, 79 54, 82 58 C 76 60, 72 62, 69 66 C 68 58, 68 52, 69 46 Z" fill="#ffb59c" stroke-width="2"/>
    <path d="M147 46 C 142 50, 137 54, 134 58 C 140 60, 144 62, 147 66 C 148 58, 148 52, 147 46 Z" fill="#ffb59c" stroke-width="2"/>
    <!-- goggle strap and lenses, pushed up on the forehead -->
    <path d="M62 74 C 90 64, 126 64, 154 74" fill="none" stroke-width="5" stroke="#2a2350"/>
    <circle cx="88" cy="70" r="12" fill="#ffd9c7"/>
    <circle cx="128" cy="70" r="12" fill="#ffd9c7"/>
    <path d="M82 66 C 84 63, 88 62, 91 63" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <path d="M122 66 C 124 63, 128 62, 131 63" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <!-- eyes -->
    <ellipse cx="88" cy="95" rx="5" ry="6.5" fill="#2a2350" stroke="none"/>
    <ellipse cx="124" cy="95" rx="5" ry="6.5" fill="#2a2350" stroke="none"/>
    <circle cx="86.5" cy="92.5" r="1.8" fill="#ffffff" stroke="none"/>
    <circle cx="122.5" cy="92.5" r="1.8" fill="#ffffff" stroke="none"/>
    <!-- cheeks -->
    <ellipse cx="78" cy="106" rx="7" ry="4.5" fill="#ffb59c" stroke="none" opacity=".8"/>
    <ellipse cx="134" cy="106" rx="7" ry="4.5" fill="#ffb59c" stroke="none" opacity=".8"/>
    <!-- nose and mouth -->
    <path d="M103 101 L 109 101 L 106 105 Z" fill="#e98aa8" stroke-width="2"/>
    <path d="M106 105 C 106 110, 100 112, 98 108 M106 105 C 106 110, 112 112, 114 108" fill="none" stroke-width="2.4"/>
    <!-- whiskers -->
    <path d="M70 102 L 52 99 M70 108 L 52 110 M142 102 L 160 99 M142 108 L 160 110" fill="none" stroke-width="2"/>
    <!-- scarf -->
    <path d="M74 120 C 92 130, 120 130, 140 120 C 142 126, 140 132, 136 134 C 118 140, 94 140, 78 134 C 74 130, 72 126, 74 120 Z" fill="#ffb59c"/>
    <path d="M128 132 C 140 142, 156 146, 168 140 C 164 150, 150 156, 134 146" fill="#e98aa8"/>
    <!-- laptop -->
    <path d="M58 150 L 154 150 L 146 182 L 66 182 Z" fill="#383b6b"/>
    <path d="M50 182 L 162 182 L 158 192 L 54 192 Z" fill="#c9c4ea"/>
    <path d="M100 160 L 94 166 L 100 172 M112 160 L 118 166 L 112 172" fill="none" stroke="#6fe0bf" stroke-width="2.6"/>
    <path d="M52 176 C 46 170, 50 160, 60 162 C 68 164, 68 176, 62 180 Z" fill="#b9aef7"/>
    <path d="M160 176 C 166 170, 162 160, 152 162 C 144 164, 144 176, 150 180 Z" fill="#b9aef7"/>
