<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210" role="img" aria-label="DebugPilot's cat looking worried at an error">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6"/>
    </filter>
  </defs>
  <circle cx="110" cy="112" r="96" fill="#262951"/>
  <circle cx="110" cy="112" r="96" fill="none" stroke="#383b6b" stroke-width="1.5"/>
  <g filter="url(#hand)" stroke="#2a2350" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail -->
    <path d="M150 170 C 196 168, 204 118, 176 104 C 168 100, 160 106, 166 112 C 182 122, 176 152, 146 156" fill="#b9aef7"/>
    <!-- body -->
    <path d="M62 196 C 50 160, 62 122, 104 118 C 146 116, 162 158, 150 196 Z" fill="#b9aef7"/>
    <!-- belly patch -->
    <path d="M88 196 C 84 170, 92 150, 106 150 C 122 150, 128 172, 122 196" fill="#f4f0ff" stroke-width="2.4"/>
    <!-- head with ears -->
    <path d="M60 92 C 56 70, 58 52, 66 34 C 76 42, 84 50, 90 56 C 100 53, 112 53, 122 56 C 130 48, 140 40, 150 34 C 158 52, 158 72, 152 92 C 148 118, 128 128, 106 128 C 84 128, 64 118, 60 92 Z" fill="#b9aef7"/>
    <!-- inner ears -->
    <path d="M69 46 C 74 50, 79 54, 82 58 C 76 60, 72 62, 69 66 C 68 58, 68 52, 69 46 Z" fill="#ffb59c" stroke-width="2"/>
    <path d="M147 46 C 142 50, 137 54, 134 58 C 140 60, 144 62, 147 66 C 148 58, 148 52, 147 46 Z" fill="#ffb59c" stroke-width="2"/>
    <!-- goggle strap and lenses, pushed up on the forehead -->
    <path d="M62 74 C 90 64, 126 64, 154 74" fill="none" stroke-width="5" stroke="#2a2350"/>
    <circle cx="88" cy="70" r="12" fill="#ffd9c7"/>
    <circle cx="128" cy="70" r="12" fill="#ffd9c7"/>
    <path d="M82 66 C 84 63, 88 62, 91 63" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <path d="M122 66 C 124 63, 128 62, 131 63" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <!-- eyes -->
    <circle cx="88" cy="95" r="7" fill="#ffffff" stroke-width="2.4"/>
    <circle cx="124" cy="95" r="7" fill="#ffffff" stroke-width="2.4"/>
    <circle cx="88" cy="96" r="3.2" fill="#2a2350" stroke="none"/>
    <circle cx="124" cy="96" r="3.2" fill="#2a2350" stroke="none"/>
    <path d="M80 84 L 94 87 M132 84 L 118 87" fill="none" stroke-width="2.6"/>
    <!-- cheeks -->
    <ellipse cx="78" cy="106" rx="7" ry="4.5" fill="#ffb59c" stroke="none" opacity=".8"/>
    <ellipse cx="134" cy="106" rx="7" ry="4.5" fill="#ffb59c" stroke="none" opacity=".8"/>
    <!-- nose and mouth -->
    <path d="M103 101 L 109 101 L 106 105 Z" fill="#e98aa8" stroke-width="2"/>
    <ellipse cx="106" cy="112" rx="3.2" ry="3.8" fill="#2a2350" stroke-width="1.6"/>
    <!-- whiskers -->
    <path d="M70 102 L 52 99 M70 108 L 52 110 M142 102 L 160 99 M142 108 L 160 110" fill="none" stroke-width="2"/>
    <!-- scarf -->
    <path d="M74 120 C 92 130, 120 130, 140 120 C 142 126, 140 132, 136 134 C 118 140, 94 140, 78 134 C 74 130, 72 126, 74 120 Z" fill="#ffb59c"/>
    <path d="M128 132 C 140 142, 156 146, 168 140 C 164 150, 150 156, 134 146" fill="#e98aa8"/>
    <!-- note with a squiggle error line -->
    <rect x="34" y="142" width="54" height="42" rx="6" fill="#ffe1dc" transform="rotate(-6 61 163)"/>
    <path d="M44 156 L 74 154 M44 166 C 50 162, 54 170, 60 166 C 66 162, 70 170, 76 166" fill="none" stroke="#d65a4a" stroke-width="2.6"/>
    <path d="M80 180 C 74 176, 76 168, 84 168 C 92 168, 94 178, 88 182 Z" fill="#b9aef7"/>
    <!-- sweat drop -->
    <path d="M160 70 C 152 82, 152 90, 160 92 C 168 90, 168 82, 160 70 Z" fill="#bfe8ff" stroke-width="2"/>
  </g>
</svg>
