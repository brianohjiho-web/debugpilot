services:
  - type: web
    name: debugpilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /scan
    envVars:
      - key: PORT
        value: "7860"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEBUGPILOT_UNLOCK_CODE
        sync: false
