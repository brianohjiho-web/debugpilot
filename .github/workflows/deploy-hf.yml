name: Update the live website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cp deploy/hf-README.md README.md
          rm -rf .git docs .github
          git init -q -b main
          git config user.email "deploy@users.noreply.github.com"
          git config user.name "deploy"
          git add -A
          git commit -q -m "Deploy"
          HF_TOKEN=$(printf %s "$HF_TOKEN" | tr -d '[:space:]')
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
